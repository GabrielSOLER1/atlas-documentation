name: atlas-gabriel

services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
      - "127.0.0.1:${APP_HTTPS_PORT:-8443}:443"
    volumes:
      - ./certs/server.crt:/etc/atlas/server.crt:ro
      - ./certs/server.key:/etc/atlas/server.key:ro
      - ./certs/ca.crt:/etc/atlas/ca.crt:ro
    networks:
      - default
      - ingress
    dns:
      - 127.0.0.1
    environment:
      APP_ENV: prod
      APP_ENFORCE_HTTPS: ${APP_ENFORCE_HTTPS:-1}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://localhost:8443}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@atlas.u5}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET:?Copiez .env.example vers .env et renseignez APP_SECRET}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: atlas
      DB_USER: atlas
      DB_PASSWORD: ${DB_PASSWORD:?Renseignez DB_PASSWORD dans .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "bin/health"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Renseignez DB_PASSWORD dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

networks:
  default:
    internal: true
  ingress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

volumes:
  postgres_data:
