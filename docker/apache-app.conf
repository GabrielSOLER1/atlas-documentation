ServerName atlas.local
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    PassEnv APP_ENFORCE_HTTPS APP_PUBLIC_URL
    RewriteEngine On
    RewriteCond %{ENV:APP_ENFORCE_HTTPS} ^1$
    RewriteRule ^ %{ENV:APP_PUBLIC_URL}%{REQUEST_URI} [R=308,L,NE]
    ServerName atlas.local
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    LimitRequestBody 131072
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

<VirtualHost *:443>
    ServerName atlas.local
    DocumentRoot /var/www/html/public
    SSLEngine on
    SSLCertificateFile /etc/atlas/server.crt
    SSLCertificateKeyFile /etc/atlas/server.key
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5
    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    LimitRequestBody 131072
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
