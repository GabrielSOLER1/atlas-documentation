ServerName atlas.u5
ServerTokens Prod
ServerSignature Off
AddOutputFilterByType DEFLATE text/css application/javascript image/svg+xml
<FilesMatch "^index-[A-Za-z0-9_-]+\.(js|css)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
</FilesMatch>

<VirtualHost *:80>
    PassEnv APP_ENFORCE_HTTPS APP_PUBLIC_URL
    RewriteEngine On
    RewriteCond %{ENV:APP_ENFORCE_HTTPS} ^1$
    RewriteRule ^ %{ENV:APP_PUBLIC_URL}%{REQUEST_URI} [R=308,L,NE]
    ServerName atlas.u5
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    LimitRequestBody 524288
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

<VirtualHost *:443>
    ServerName atlas.u5
    DocumentRoot /var/www/html/public
    SSLEngine on
    SSLCertificateFile /etc/atlas/server.crt
    SSLCertificateKeyFile /etc/atlas/server.key
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5
    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    LimitRequestBody 524288
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
